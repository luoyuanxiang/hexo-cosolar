# 复制到 Hexo 博客根目录为 _config.cosolar.yml（覆盖主题默认配置）
# 完整字段与中文注释见主题包内 _config.yml

basic:
  logo_text: 墨韵云阁
  tagline: 热爱技术，乐于分享
  footer_text: "&copy; 2026 墨韵云阁"
  icp: ""

style:
  primary_color: "#10B981"
  color_scheme: auto # auto | light | dark
  content_width: 1600
  default_post_cover: ""

social:
  author_name: 墨韵云阁
  author_bio: 热爱技术，乐于分享
  author_location: 中国-成都
  author_join_date: "2026-07-22"
  github: "https://luoyuanxiang.top"
  email: "1141306760@qq.com"
  juejin: "https://juejin.cn/user/3104676568636152"
  csdn: "https://blog.csdn.net/baidu_38296324?spm=1000.2115.3001.5343"
  zhihu: "https://www.zhihu.com/people/luoyuanxiangvip"

featured:
  show_featured: true
  autoplay: true
  interval: 5000
  featured_max_count: 5
  fallback: latest # latest | pinned | none
  # 精选文章：填写文章 path / slug / 标题
  featured_posts: []
  # Hexo 移植版仅实现分页；scroll 暂不生效
  home_load_mode: pagination

sidebar:
  show_sidebar: true
  show_author: true
  show_announcement: true
  announcement_content: "欢迎来到我的博客 👋"
  show_tag_cloud: true
  show_categories: true
  show_recent: true
  show_sidebar_links: true
  show_sidebar_feeds: false

background_light:
  bg_type: none # none | image | dynamic

background_dark:
  bg_type: none

menu:
  - name: 首页
    url: /
    icon: icon-shouye
  - name: 分类
    url: /categories/
    icon: icon-fengfuduoyuan
  - name: 标签
    url: /tags/
    icon: icon-bokexinwen
  - name: 归档
    url: /archives/
    icon: icon-jishufuwu
  - name: 友链
    url: /links/
    icon: icon-kaiyuan
  # 仅分组时必须显式 url: '#'，否则会与主题默认菜单按位合并后误带上 /about/
  - name: 文档
    url: '#'
    icon: icon-blog
    children:
      - name: Hexo
        url: https://hexo.io
        target: _blank
  - name: 关于
    url: /about/
    icon: icon-bokeyuan

search:
  enable: true
  path: search.json
  placeholder: 搜索文章

comment:
  provider: twikoo # none | twikoo | waline
  twikoo:
    envId: "https://twikoo.luoyuanxiang.top"
    region: ""
  waline:
    serverURL: ""

busuanzi:
  enable: true

# 回到顶部（全局悬浮按钮）
back_to_top:
  enable: true
  position: right # left | right
  show_height: 400 # 像素，或 "20%"

upvote:
  enable: true
  provider: local # local | leancloud

# 友链页申请面板（覆盖主题默认「评论留言」流程）
links:
  apply:
    enable: true
    site_name: 墨韵云阁
    site_description: 热爱技术，乐于分享
    site_url: https://luoyuanxiang.top/
    site_avatar: https://luoyuanxiang.top/images/logo.png
    button_enable: true
    button_text: 自助申请友链
    issue_url: https://github.com/luoyuanxiang/hexo-cosolar/issues/new?template=friend-link.yml
    pr_enable: true
    pr_button_text: 提交 PR
    pr_url: https://github.com/luoyuanxiang/hexo-cosolar/edit/main/source/_data/links.yml
    steps:
      - title: 添加本站友链
        desc: 请先复制左侧本站信息，并添加到贵站的友情链接页
      - title: 填写 GitHub 申请表
        desc: 点击下方「自助申请友链」提交站点名称、首页、友链页、描述与头像
      - title: 自动校验与人工审核
        desc: 机器人校验可达性与回链后，由维护者审核；通过后自动写入友链列表
    notice:
      enable: true
      title: 友链须知
      open: true
      items:
        - 申请前请先添加本站友链，且友链页可公开访问
        - 网站需使用域名并启用 HTTPS，不接受 IP 或内网站点
        - 头像需可被第三方页面直接加载（勿开启防盗链）
        - 以个人博客 / 技术站点为主，内容健康合规
        - 不定期检查友链；长期失效、单方面取消或违规内容可能移除
        - 交换友链即表示同意本站须知与免责声明

footer:
  show_footer_main: false